<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Token MVP 비교</title>
    <link rel="stylesheet" href="../dist/tokens.css" />
    <link rel="stylesheet" href="../dist/tokens-v2.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      h1 { margin: 0 0 16px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(280px, 1fr));
        gap: 20px;
      }
      .panel {
        padding: 20px;
        border-radius: 16px;
        border: 1px solid #cbd5e1;
      }
      .v1.panel {
        background: var(--color-bg-surface);
        color: var(--color-text-default);
        font-family: var(--typography-fontFamily);
      }
      .v2 {
        background: var(--color-bg-surface);
        color: var(--color-text-default);
        font-family: var(--typography-fontFamily);
      }
      .title { margin: 0 0 12px; font-size: 18px; }
      .desc { margin: 0 0 14px; font-size: 14px; color: #475569; }
      .btn {
        border: none;
        border-radius: var(--component-button-primary-radius);
        background: var(--component-button-primary-bg);
        color: var(--component-button-primary-text);
        padding: var(--component-button-primary-paddingY) var(--component-button-primary-paddingX);
        cursor: pointer;
      }
      .input {
        display: block;
        width: 100%;
        margin-top: 12px;
        border: 1px solid var(--component-input-default-border);
        border-radius: var(--component-input-default-radius);
        background: var(--component-input-default-bg);
        color: var(--component-input-default-text);
        padding: var(--component-input-default-paddingY) var(--component-input-default-paddingX);
      }
      .v2 {
        --color-bg-primary: #0F766E;
        --color-bg-surface: #F8FAFC;
        --color-border-default: #94A3B8;
        --color-text-default: #0B1220;
        --color-text-inverse: #F8FAFC;
        --component-button-primary-bg: #0F766E;
        --component-button-primary-paddingX: 1.125rem;
        --component-button-primary-paddingY: 0.625rem;
        --component-button-primary-radius: 0.625rem;
        --component-button-primary-text: #F8FAFC;
        --component-input-default-bg: #F8FAFC;
        --component-input-default-border: #94A3B8;
        --component-input-default-paddingX: 1.125rem;
        --component-input-default-paddingY: 0.625rem;
        --component-input-default-radius: 0.375rem;
        --component-input-default-text: #0B1220;
        --typography-fontFamily: Pretendard, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Token Version 비교 (V1 vs V2)</h1>
    <div class="grid">
      <section class="panel v1">
        <h2 class="title">Version 1 (현재 MVP)</h2>
        <p class="desc">Blue 중심, 각진 radius, compact spacing</p>
        <button class="btn">Primary Action</button>
        <input class="input" placeholder="이메일을 입력하세요" />
      </section>
      <section class="panel v2">
        <h2 class="title">Version 2 (대안)</h2>
        <p class="desc">Teal 중심, 살짝 각진 radius, 넓은 spacing</p>
        <button class="btn">Primary Action</button>
        <input class="input" placeholder="이메일을 입력하세요" />
      </section>
    </div>
  </body>
</html>
